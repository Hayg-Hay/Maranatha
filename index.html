<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maranatha — Offline Bible Browser</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f3f1ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#201b16" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Maranatha">
</head>
<body>
  <main class="shell">
    <header>
<img src="Armenian-cross_2.png" alt="Armenian Cross">

  <div>
    <h1>Maranatha</h1>
    <p>Offline Bible browser</p>
  </div>
</header>

    <section class="panel" aria-labelledby="lookup-heading">
      <h2 id="lookup-heading">Browse</h2>
      <div class="reference-search">

  <label for="reference">Reference</label>

      <div class="reference-row">

    <input
      id="reference"
      type="text"
      placeholder="Examples: John 3:16, Genesis 1, Psalm 23"
      autocomplete="off"
      spellcheck="false"
    >

    <button id="reference-go" type="button">Show</button>

  </div>

  <button id="context-toggle" type="button" style="display:none">Show context (±3)</button>

</div>
      <div class="nav-row">
     
        <label for="book">Book
          <select id="book"></select>
        </label>
        <label for="chapter">Chapter
          <select id="chapter"></select>
        </label>
        <button id="prev-chapter-button" type="button">&larr; Previous chapter</button>
        <button id="next-chapter-button" type="button">Next chapter &rarr;</button>
        <button id="go-button" type="button">Show</button>
        <label>Layout <select id="layout"><option value="auto">Automatic</option><option value="multicolumn">Multi-column</option><option value="multirow">Multi-row</option></select></label>
        <label>Color scheme <select id="theme"><option value="">Default</option><option value="red">Red</option><option value="orange">Orange</option><option value="yellow">Yellow</option><option value="green">Green</option><option value="blue">Blue</option><option value="indigo">Indigo</option><option value="violet">Violet</option><option value="rose">Rose</option></select></label>
        <label>Reading <select id="reading"><option value="">Default</option><option value="warm">Warm / Sepia</option><option value="low-contrast">Low contrast</option></select></label>
        <label>Appearance <select id="appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
        <label>Language <select id="language"></select></label>
        <label>Font size <select id="fontsize">
  <option value="">Normal (default)</option>
  <option value="large">Large</option>
  <option value="larger">Larger</option>
  <option value="largest">Largest</option>
</select></label>
      </div>
      <fieldset id="translations"><legend>Translations</legend></fieldset>
    </section>

    <section id="message" class="message" aria-live="polite"></section>
    <section id="results" aria-live="polite"></section>
  </main>
  <footer>Built for offline personal use. See PROJECT_HISTORY.md for how this was assembled.</footer>
  <script src="data/canon.js"></script>
  <script src="data/locales/en.js"></script>
  <script src="data/locales/hy.js"></script>
  <script src="app.js"></script>
  <script>
    // Register the service worker for offline use, but ONLY over http(s).
    // Opening index.html directly from disk (file://) must keep working with
    // no server; a service worker cannot run there anyway, so the protocol
    // check keeps the desktop workflow untouched and error-free.
    //
    // This block also shows an "update available" banner when a newly deployed
    // service worker is waiting. The worker no longer self-activates (its
    // install handler does not call skipWaiting), so updates are user-driven:
    // the banner's Reload button posts SKIP_WAITING, and the page reloads into
    // the new shell once the worker takes control. See service-worker.js.
    if (
      'serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.protocol === 'http:')
    ) {
      let reloadPending = false;

      // Reload only when the user asked for the update, so the browser's
      // first-install clients.claim() doesn't cause a spurious refresh.
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadPending) window.location.reload();
      });

      const showUpdateBanner = (registration) => {
        if (document.getElementById('update-banner')) return;
        const banner = document.createElement('div');
        banner.id = 'update-banner';
        banner.className = 'update-banner';
        banner.setAttribute('role', 'status');

        const text = document.createElement('span');
        text.textContent = 'A new version of Maranatha is available.';

        const reload = document.createElement('button');
        reload.type = 'button';
        reload.textContent = 'Reload';
        reload.addEventListener('click', () => {
          reloadPending = true;
          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          } else {
            window.location.reload();
          }
        });

        const later = document.createElement('button');
        later.type = 'button';
        later.textContent = 'Later';
        later.addEventListener('click', () => banner.remove());

        banner.append(text, reload, later);
        document.body.appendChild(banner);
      };

      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./service-worker.js')
          .then((registration) => {
            // An update may already be waiting from an earlier session.
            if (registration.waiting && navigator.serviceWorker.controller) {
              showUpdateBanner(registration);
            }

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                // 'installed' plus an existing controller means this is an
                // update to a page already under service-worker control, not
                // the very first install.
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  showUpdateBanner(registration);
                }
              });
            });
          })
          .catch((error) => {
            console.warn('Service worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
